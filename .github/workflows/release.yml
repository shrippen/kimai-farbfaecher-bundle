# Tag vX.Y.Z (version = composer.json, CHANGELOG has "## X.Y.Z – <date>")
#   ──► lint ──► build FarbfaecherBundle-X.Y.Z.zip ──► install the zip into Kimai 2.67 and test it
#   ──► release with notes from CHANGELOG, zip attached
#
# Runs on Gitea (git.arianw.de) and on the GitHub mirror, each creates its own release.
# A release created in the Gitea UI with a new tag works the same: the zip is attached to it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIMAI_VERSION: '2.67.0'
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kimai
          MARIADB_USER: kimai
          MARIADB_PASSWORD: kimai
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, zip, xsl, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Check version and changelog
        working-directory: plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          composer=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"];')
          if [ "$version" != "$composer" ]; then
            echo "Tag $GITHUB_REF_NAME does not match composer.json version $composer" >&2
            exit 1
          fi
          heading=$(grep -E "^## v?$version( |$)" CHANGELOG.md || true)
          if [ -z "$heading" ] || grep -qi 'unveröffentlicht\|unreleased' <<< "$heading"; then
            echo "CHANGELOG.md needs a released heading for $version, found: '$heading'" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=FarbfaecherBundle-$version.zip" >> "$GITHUB_ENV"

      - name: Lint
        working-directory: plugin
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          node --check Resources/assets/color-field.js

      - name: Build plugin zip
        # Kimai expects the folder var/plugins/FarbfaecherBundle/, dev files are excluded via .gitattributes
        working-directory: plugin
        run: |
          git archive --format=zip --prefix=FarbfaecherBundle/ -o "../$ZIP" HEAD
          unzip -l "../$ZIP"

      - name: Database host
        run: |
          host=127.0.0.1
          if getent hosts mariadb > /dev/null; then host=mariadb; fi
          echo "DATABASE_URL=mysql://kimai:kimai@$host:3306/kimai?charset=utf8mb4&serverVersion=10.11.0-MariaDB" >> "$GITHUB_ENV"

      - name: Install Kimai
        run: plugin/dev/ci-kimai.sh kimai

      - name: Test the release zip in Kimai
        run: plugin/dev/ci.sh kimai "$ZIP"

      - name: Release notes
        working-directory: plugin
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## v?" v "( |$)" { on = 1; next }
            /^## /                  { on = 0 }
            on
          ' CHANGELOG.md > ../notes.md
          test -s ../notes.md

      - name: Publish on GitHub
        if: github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Farbfächer $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish on Gitea
        if: github.server_url != 'https://github.com'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          auth="Authorization: token $TOKEN"
          json() { php -r '$d = json_decode(stream_get_contents(STDIN), true); echo $d[$argv[1]] ?? "";' "$1"; }

          # reuse a release created in the UI for this tag, otherwise create one
          id=$(curl -sf -H "$auth" "$API/releases/tags/$GITHUB_REF_NAME" | json id || true)
          if [ -z "$id" ]; then
            body=$(php -r 'echo json_encode(["tag_name" => $argv[1], "name" => "Farbfächer " . $argv[2], "body" => file_get_contents("notes.md")]);' "$GITHUB_REF_NAME" "$VERSION")
            id=$(curl -sf -X POST "$API/releases" -H "$auth" -H 'Content-Type: application/json' -d "$body" | json id)
          fi

          # replace an older upload of the same file (re-run)
          old=$(curl -sf -H "$auth" "$API/releases/$id/assets" | php -r 'foreach (json_decode(stream_get_contents(STDIN), true) as $a) { if ($a["name"] === $argv[1]) { echo $a["id"]; } }' "$ZIP")
          if [ -n "$old" ]; then
            curl -sf -X DELETE -H "$auth" "$API/releases/$id/assets/$old"
          fi
          curl -sf -X POST "$API/releases/$id/assets?name=$ZIP" -H "$auth" -F "attachment=@$ZIP" > /dev/null
